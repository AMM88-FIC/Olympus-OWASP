# Test plan: ADA Refactor
#
# This file declares which test cases the verdict engine runs, and how
# each is executed. Two handler types are supported:
#
#   type = "llm"            Reads the markdown prompt file from prompts/
#                           and runs the standard LLM verdict flow.
#
#   type = "programmatic"   Imports the handler from functions/ and calls
#                           it directly. No model interaction. The handler
#                           must return a verdict dict matching the LLM
#                           output shape.
#
# The TOML section name (e.g. STORAGE-1-1) is the test_id used throughout
# the engine. It becomes the output filename (<test_id>.json) and is
# what the test_filter setting in config.ini matches against.
#
# Tests run in the order they appear in this file.

name = "ADA Refactor"
version = "1.0"


# ------------------------------------------------------------
# 1. STORAGE
# ------------------------------------------------------------

[tests.STORAGE-1-1]
type = "llm"
prompt = "1-STORAGE-1-1-1.md"

