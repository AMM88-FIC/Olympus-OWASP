# Test plan: OWASP MASTG v2 (tests-beta)
#
# Source of truth: OWASP MASTG `tests-beta/` (the MASVS v2 / MASWE-based
# test set). Tests are organized on disk by MASVS category:
#
#   prompts/MASVS-<CATEGORY>/MASTG-TEST-XXXX.md     (llm prompts)
#   functions/MASVS-<CATEGORY>/...                  (programmatic handlers)
#
# Handler types:
#   type = "llm"            Reads the markdown prompt named by `prompt`
#                           (path is relative to prompts/, so it includes
#                           the MASVS-<CATEGORY>/ subdirectory) and runs the
#                           standard LLM verdict flow.
#   type = "programmatic"   Imports the handler from functions/ and calls it.
#                           NOTE: the current loader imports handlers as
#                           functions.<module>, so nested category subdirs
#                           are not yet importable. None are needed for
#                           STORAGE; revisit when CODE/RESILIENCE land.
#
# The TOML section name (e.g. MASTG-TEST-0202) is the test_id used
# throughout the engine: it is the output filename (<test_id>.json) and
# what `test_filter` matches against. It matches the `test_id` each prompt
# emits in its output JSON.
#
# category = "<MASVS category>" is a filter label. The `--test-filter` flag
# (and [paths].test_filter) matches against BOTH the test_id AND this
# category, so `--test-filter storage` selects every STORAGE test and
# `--test-filter crypto` selects every CRYPTO test, while `--test-filter
# MASTG-TEST-0202` (or just `0202`) still selects a single test. The
# parallel runner treats the filter as a regex, so `storage|crypto` selects
# both groups. The label does not affect execution or output.
#
# DYNAMIC TESTS: OWASP tests typed dynamic (hooks / device filesystem)
# cannot run in this static engine; they are implemented here as
# best-effort STATIC APPROXIMATIONS that always emit
# needs_dynamic_testing: true (runtime confirmation still required).
#
# Tests run in the order they appear in this file.

