# ============================================================
#  Verdict engine configuration
# ============================================================
#
# Copy this file and edit per-environment. CLI flags passed to
# run_verdict_engine.py override values here. Paths in [paths] are resolved
# relative to THIS file's directory; CLI path overrides are resolved
# relative to the working directory.
#
# API keys are NEVER stored in this file. The api_key_env setting names an
# environment variable that holds the key; the runner reads from there.

[backend]
# Which backend to use. Options: openai | gemini
type = gemini
# Model identifier. For openai: as known to the backend (e.g. 'gpt-oss:120b'
# for Ollama, 'gpt-4o' for the official API). For gemini: e.g.
# 'gemini-3-pro-preview', 'gemini-3-flash-preview'.
model = gemini-2.5-pro


[openai]
# OpenAI-compatible base URL.
#   Ollama:    http://localhost:11434/v1
#   vLLM:      http://localhost:8000/v1
#   OpenWebUI: http://localhost:8080/api
#   OpenAI:    https://api.openai.com/v1
#   DeepSeek:  https://api.deepseek.com/v1
base_url =
# Environment variable holding the API key. Use 'OPENAI_API_KEY' or any
# name you prefer. For local Ollama with no auth, leave the env var unset
# and the runner will fall back to a placeholder string.
api_key_env = 
temperature = 0.0
# Reasoning depth for gpt-oss-style models. low | medium | high
reasoning_effort = medium
# JSON-mode enforcement. off | object | schema
#   off    — no constraint (default).
#   object — every turn's content must be valid JSON. Recommended for
#            models that produce prose by default.
#   schema — strict union schema covering protocol + verdict shapes.
json_mode = on
# Per-request timeout in seconds. Local 100B+ models can be slow on long
# histories — 600s gives plenty of room.
request_timeout = 600
num_ctx = 131072 


[gemini]
# Override the model from [backend] if you want gemini-specific selection.
# model = gemini-3-pro-preview
api_key_env = 
# Input tokens-per-minute quota. The runner paces requests to stay under
# 90% of this. Set to 0 to disable pacing.
tpm_limit = 2000000
# Requests-per-minute quota (used by run_parallel.py's shared limiter, which
# paces ALL worker threads together so the account quota is never exceeded).
# Set to your real Gemini 2.5 Pro tier limit. 0 disables RPM pacing.
rpm_limit = 150
# run_parallel.py only: cache the whole constant prefix server-side — system
# prompt + tool declarations + the deterministic handshake transcript (which
# includes the schema) — so it is billed at the cache-hit rate instead of
# being re-sent on every turn. Do not use!!! While not fully sure, the
# implicit cache works very well, and accounts for longer conversations, 
# which will translate in using less billing.
use_explicit_cache = false
# Explicit-cache time-to-live in seconds. Keep ≥ your expected run duration.
cache_ttl_seconds = 3600


[parallel]
# run_parallel.py only. Concurrency model for the test plan.
#   flat   — every test queued at once; each runs as soon as a worker slot and
#            the rate budget are free. Maximises throughput.
#   groups — bucket tests by ID prefix and run one test per group per round,
#            so groups advance together in lockstep rounds.
mode = flat
# Max test cases in flight at once (worker threads). Size this against your
# RPM/TPM limits: each in-flight test issues many sequential requests.
max_workers = 16
# How to derive a test's group when mode = groups:
#   alpha — first dash-segment containing letters ('1-STORAGE-1-1' → STORAGE,
#           'CODE-1-1' → CODE).
#   first — the first dash-segment verbatim.
group_by = alpha


[paths]
# Paths can be absolute or relative to this config file's directory.
apk_root = storage/artifacts/xxxxxx
system_prompt = app/layer4/prompts/system/1.system_prompt-v1.3.10.md
schema = app/layer4/prompts/system/2.layer3_schema_v1.2.5_full_spec.md
evidence_dir = storage/artifacts/xxxxxx/evidence
test_plan_dir = app/layer4/test_plans/owasp_mastg/
# run_parallel.py: case-insensitive REGEX matched against each test_id
# (re.search). Empty = run all. Examples:
#   storage|network   → tests whose id contains STORAGE or NETWORK
#   ^1-STORAGE        → ids starting with 1-STORAGE
#   CRYPTO-1-[12]$    → CRYPTO-1-1 and CRYPTO-1-2
# (--test-filter on the CLI overrides this. In a shell, escape the pipe:
#  --test-filter storage\|network so the shell doesn't treat | as a pipe.)
test_filter=
output_dir =


[retry]
# Test-level retry: if a verdict fails to parse or the test crashes,
# retry the whole test up to this many additional times. 2 means up to
# 3 total attempts.
max_test_retries = 2
retry_delay_seconds = 10
# Per-request retry: handles transient HTTP errors (429/500/503/504).
# Per-test retry sits on top of this.
max_request_retries = 6
request_retry_base_seconds = 5
request_retry_max_seconds = 120


[tools]
# Max rounds of tool calls per verdict before giving up.
max_tool_iterations = 35


[verifier]
# run_parallel.py only. After the analyst produces a verdict, an independent
# stateless LLM call reviews it ("do the cited evidence and rationale support
# this verdict and certainty?"). On rejection, the reviewer's comments are
# nudged back into the SAME analyst session to revise, up to max_rounds.
enabled = true
# Number of REVISION attempts. An initial review is ALWAYS done; each revision
# is re-reviewed. So:
#   0 = review-only (audit): record accept/reject, never ask to revise.
#   1 = review → (if rejected) revise once → re-review → save.
#   2 = up to two revise→re-review cycles.
max_rounds = 2
# Model for the verifier. Empty = same as [backend].model. A faster/cheaper
# model is a good fit here, e.g. gemini-2.5-flash.
model = gemini-2.5-flash
# Optional path to a custom verifier system prompt (relative to this file).
# Empty = use the built-in default in app/layer4/verifier.py.
system_prompt =
# Also show the verifier the original test prompt (extra context for judging
# relevance). true is higher quality; false sends only the verdict.
include_test_prompt = true
# When true, log the full request sent to the verifier, the tokens it used,
# and its raw reply — for each review. Handy for debugging/tuning; noisy.
verbose = false


[rag]
# NOT IMPLEMENTED | DO NOT ENABLE
# Enable semantic code search via the search_code tool. Requires
# 'pip install chromadb sentence-transformers'. Index lives at
# <apk_root>/.rag_index/ and is built on first run.
enabled = false
index_smali = false
embed_model = BAAI/bge-small-en-v1.5


[behavior]
abort_on_error = false

[preprocessors]
# Each entry is a comma-separated chain of preprocessor names applied to
# evidence files before delivery to the model. Names refer to the registry
# in app/layer4/preprocessors/__init__.py (REGISTRY).
#
# Special key 'default' applies to every evidence file unless overridden.
# Per-file keys (e.g. 'strings.json') supersede the default for that file.
#
# Available preprocessors:
#   slim_strings  — Trim strings.json records to id/category/value/path,
#                   leaving full records reachable via the get_string_record
#                   tool. Only applies to strings.json (no-op elsewhere).
#                   Saves ~70% on strings.json size.
#   minify_json   — Terminal preprocessor. Re-emit the parsed evidence as
#                   compact JSON (no whitespace, no indentation). Lossless;
#                   gives ~25-35% reduction over prettified JSON. Must be
#                   the LAST entry in any chain that includes it.
#
# Recommended starting point: minify everything by default, slim+minify on
# strings.json. This gives lossless ~30% reduction on most files, plus the
# 70% reduction on strings.json from slimming.
#
# Note: when no terminal preprocessor is present in a chain (and at least
# one non-terminal preprocessor ran), the chain runner already minifies
# the output. So `slim_strings, minify_json` and `slim_strings` alone
# produce identical results. The `minify_json` entry is most useful in
# the `default` chain, where it ensures every passed-through file gets
# minified even if no other preprocessor applies.
#
# Defaults if this section is omitted: strings.json = slim_strings (matches
# pre-refactor behavior — minified delivery is opt-in).
default = minify_json
strings.json = slim_strings, minify_json
